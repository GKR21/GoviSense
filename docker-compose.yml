version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: govisense_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-govisense}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - govisense_pgdata:/var/lib/postgresql/data
      - ./data/database/db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-govisense}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - govisense-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govisense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOVISENSE_ENV=production
      - SECRET_KEY=govisense-dev-secret-key-change-in-production-2026-sri-lanka
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-govisense}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://localhost:8443
      - PILOT_DISTRICT=Anuradhapura
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models_store
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - govisense-data:/app/data
      - govisense-models:/app/models_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - govisense-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govisense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - govisense-network

networks:
  govisense-network:
    driver: bridge

volumes:
  govisense-data:
  govisense-models:
  govisense_pgdata:
    driver: local
