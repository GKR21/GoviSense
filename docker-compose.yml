version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: govisense-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - GOVISENSE_ENV=production
      - SECRET_KEY=govisense-dev-secret-key-change-in-production-2026-sri-lanka
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - DATABASE_URL=sqlite:///./data/govisense.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - PILOT_DISTRICT=Anuradhapura
      - DATA_DIR=/app/data
      - MODELS_DIR=/app/models_store
    volumes:
      - govisense-data:/app/data
      - govisense-models:/app/models_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - govisense-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: govisense-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - govisense-network

networks:
  govisense-network:
    driver: bridge

volumes:
  govisense-data:
  govisense-models:

